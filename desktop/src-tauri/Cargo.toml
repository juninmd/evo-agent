[package]
name = "evo-agent-console"
version = "0.1.0"
description = "Console desktop do evo-agent: consome a API REST do agente publicado"
edition = "2021"
rust-version = "1.85"

[lib]
name = "evo_agent_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Mesma configuracao de TLS do canto-widget: rustls sem provider embutido, com
# ring instalado aqui, para nao compilar aws-lc no Windows.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
